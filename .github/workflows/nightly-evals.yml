# Nightly eval tier: the functional suite against real Minimal installs from
# the stable and nightly channels, plus two canaries (obsolescence, docs
# drift). A blocking failure files (or updates) a tracking issue rather than
# rotting in the Actions tab. Runner CLI contract: evals/SCHEMA.md.
name: nightly-evals

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  text:
    # The text tier, once. These cases grade what the model says against the
    # skills; none of them invokes `min`, so running them per channel bought
    # no signal and doubled the exposure to a marginal case going red — which
    # is what it did (2026-08-23 through 08-27: config-003, config-004,
    # config-007, loadouts-004/007/012 drifting in and out between runs,
    # failing in one channel leg while passing in the other on the same
    # commit). BLOCKING - feeds notify.
    #
    # No Minimal install: the runner only demands `min` when functional cases
    # are selected, so this lane starts a job sooner and cannot be broken by
    # an installer outage.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run evals (text tier, 3 trials)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p evals/reports
          uv run --project evals evals/runner.py --tier text --trials 3 \
            --skip-permissions \
            --report evals/reports/text.json \
            --summary summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-report
          path: evals/reports/text.json
          if-no-files-found: ignore

  functional:
    # The functional tier against a real `min` from each release channel —
    # the only cases whose result can depend on which binary is installed.
    # BLOCKING - feeds notify.
    #
    # `needs: text` is for the token, not for ordering logic: every eval job
    # spends the same CLAUDE_CODE_OAUTH_TOKEN, and this keeps the lanes
    # end-to-end rather than adding a third concurrent spender to the pair
    # that already exhausted it.
    needs: text
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One channel at a time: every eval job spends the same
      # CLAUDE_CODE_OAUTH_TOKEN, and running the lanes concurrently
      # exhausted its rate limit mid-run (2026-08-01: ~80 real trials per
      # job, then every later claude invocation failed in ~1s and was
      # graded as a skill regression).
      max-parallel: 1
      matrix:
        channel: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Minimal (${{ matrix.channel }} channel)
        # Verbatim installer from the published install guide, with the
        # channel substituted into the go.minimal.dev path.
        run: curl --proto "=https" --tlsv1.2 -fsSL https://go.minimal.dev/${{ matrix.channel }} | sh
      - name: Ensure min is on PATH
        # The installer's bin prefix is ${MINIMAL_BIN:-$HOME/.local/bin}.
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/min" --version
      - name: Run evals (functional tier, 3 trials)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p evals/reports
          uv run --project evals evals/runner.py --tier functional --trials 3 \
            --skip-permissions \
            --report evals/reports/functional-${{ matrix.channel }}.json \
            --summary summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-report-${{ matrix.channel }}
          path: evals/reports/functional-${{ matrix.channel }}.json
          if-no-files-found: ignore
      - name: Teardown Minimal (best effort)
        if: always()
        run: |
          min session destroy --all --force || true
          min stop --force || true

  obsolescence:
    # Canary: run the text tier WITHOUT installing the skills into the
    # workspace. When the bare model starts passing everywhere, the skills
    # are paying no rent. Advisory - never trips notify.
    #
    # Serialized after functional (same shared-token rationale as the
    # functional matrix's max-parallel: 1). always() so the advisory canary
    # still runs when a functional lane fails.
    needs: functional
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run text tier without skills
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p evals/reports
          uv run --project evals evals/runner.py --tier text --without-skill \
            --trials 3 --skip-permissions \
            --report evals/reports/obsolescence.json --summary summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsolescence-report
          path: evals/reports/obsolescence.json
          if-no-files-found: ignore

  docs-drift:
    # Canary, no LLM: hash the PROSE of the published minimal.dev pages the
    # skills link and compare against the committed snapshot. Content drift
    # means a skill may be restating (or contradicting) stale docs. Site
    # chrome is excluded deliberately: see evals/docs_hash.py. BLOCKING.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check linked docs pages for drift
        shell: bash
        run: |
          set -euo pipefail
          snapshot=evals/docs-snapshots.json
          mapfile -t urls < <(grep -rhoE 'https://minimal\.dev/[A-Za-z0-9._/-]+' skills/*/SKILL.md 2>/dev/null | sed -E 's/[.,]+$//' | sort -u)
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::No https://minimal.dev/ URLs found in skills/*/SKILL.md" >&2
            exit 1
          fi
          # Hash the prose, not the response. Astro fingerprints every asset
          # per build, so hashing whole pages made an unrelated site deploy
          # look like all nine tracked pages drifting at once.
          current_json="$(python3 evals/docs_hash.py "${urls[@]}")"
          declare -A current
          while IFS=$'\t' read -r url hash; do
            current["$url"]="$hash"
          done < <(printf '%s' "$current_json" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')
          if [ ! -f "$snapshot" ]; then
            echo "::warning::$snapshot does not exist yet. Commit the JSON below as $snapshot to arm this canary."
            echo "$current_json"
            exit 0
          fi
          drift=0
          for url in "${urls[@]}"; do
            old="$(jq -r --arg u "$url" '.[$u] // empty' "$snapshot")"
            if [ -z "$old" ]; then
              echo "NEW (not in snapshot): $url"
              drift=1
            elif [ "$old" != "${current[$url]}" ]; then
              echo "CHANGED: $url"
              drift=1
            fi
          done
          if [ "$drift" -ne 0 ]; then
            echo "::error::Docs drift detected. Review the pages above, update the skills if needed, then commit this as $snapshot:"
            echo "$current_json"
            exit 1
          fi
          echo "No drift across ${#urls[@]} linked docs pages."

  notify:
    # Open or update a single tracking issue when a blocking nightly job
    # fails. obsolescence is continue-on-error, so it never lands here.
    needs: [text, functional, obsolescence, docs-drift]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the nightly-evals tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FUNCTIONAL: ${{ needs.functional.result }}
          OBSOLESCENCE: ${{ needs.obsolescence.result }}
          DOCS_DRIFT: ${{ needs.docs-drift.result }}
        run: |
          set -euo pipefail
          # Dedup by label, not title search: label filtering is immediately
          # consistent, so back-to-back failures cannot open duplicates.
          gh label create nightly --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Nightly eval failure" 2>/dev/null || true
          body="$(printf 'A nightly-evals run failed.\n\n- functional: %s\n- obsolescence (advisory): %s\n- docs-drift: %s\n\nRun: %s' \
            "$FUNCTIONAL" "$OBSOLESCENCE" "$DOCS_DRIFT" "$RUN_URL")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label nightly --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "nightly-evals failure" --body "$body" --label nightly
          fi
