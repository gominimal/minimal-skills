# Nightly eval tier: the functional suite against real Minimal installs from
# the stable and nightly channels, plus two canaries (obsolescence, docs
# drift). A blocking failure files (or updates) a tracking issue rather than
# rotting in the Actions tab. Runner CLI contract: evals/SCHEMA.md.
name: nightly-evals

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  text:
    # The text tier, once. These cases grade what the model says against the
    # skills; none of them invokes `min`, so running them per channel bought
    # no signal and doubled the exposure to a marginal case going red — which
    # is what it did (2026-08-23 through 08-27: config-003, config-004,
    # config-007, loadouts-004/007/012 drifting in and out between runs,
    # failing in one channel leg while passing in the other on the same
    # commit). BLOCKING - feeds notify.
    #
    # No Minimal install: the runner only demands `min` when functional cases
    # are selected, so this lane starts a job sooner and cannot be broken by
    # an installer outage.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run evals (text tier, 3 trials)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p evals/reports
          uv run --project evals evals/runner.py --tier text --trials 3 \
            --skip-permissions \
            --report evals/reports/text.json \
            --summary summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-report
          path: evals/reports/text.json
          if-no-files-found: ignore

  functional:
    # The functional tier against a real `min` from each release channel —
    # the only cases whose result can depend on which binary is installed.
    # BLOCKING - feeds notify.
    #
    # `needs: text` is for the token, not for ordering logic: every eval job
    # spends the same CLAUDE_CODE_OAUTH_TOKEN, and this keeps the lanes
    # end-to-end rather than adding a third concurrent spender to the pair
    # that already exhausted it.
    needs: text
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One channel at a time: every eval job spends the same
      # CLAUDE_CODE_OAUTH_TOKEN, and running the lanes concurrently
      # exhausted its rate limit mid-run (2026-08-01: ~80 real trials per
      # job, then every later claude invocation failed in ~1s and was
      # graded as a skill regression).
      max-parallel: 1
      matrix:
        channel: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Minimal (${{ matrix.channel }} channel)
        # Verbatim installer from the published install guide, with the
        # channel substituted into the go.minimal.dev path.
        run: curl --proto "=https" --tlsv1.2 -fsSL https://go.minimal.dev/${{ matrix.channel }} | sh
      - name: Ensure min is on PATH
        # The installer's bin prefix is ${MINIMAL_BIN:-$HOME/.local/bin}.
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/min" --version
      - name: Run evals (functional tier, 3 trials)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p evals/reports
          uv run --project evals evals/runner.py --tier functional --trials 3 \
            --skip-permissions \
            --report evals/reports/functional-${{ matrix.channel }}.json \
            --summary summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-report-${{ matrix.channel }}
          path: evals/reports/functional-${{ matrix.channel }}.json
          if-no-files-found: ignore
      - name: Teardown Minimal (best effort)
        if: always()
        run: |
          min session destroy --all --force || true
          min stop --force || true

  obsolescence:
    # Canary: run the text tier WITHOUT installing the skills into the
    # workspace. When the bare model starts passing everywhere, the skills
    # are paying no rent. Advisory - never trips notify.
    #
    # Serialized after functional (same shared-token rationale as the
    # functional matrix's max-parallel: 1). always() so the advisory canary
    # still runs when a functional lane fails.
    #
    # One trial per case, and the runner never retries in --without-skill
    # mode, neither the failed-case retry nor the infra-error backoff, so the
    # tier is at most one claude call per case (91 as of 2026-09-12). At the
    # usual ~20s a call that is about 30 minutes; 90 covers a 55s-a-call day.
    # Before this the job reached 41 of 91 cases and was cancelled with no
    # report on 22 of the 25 nights to 2026-09-11. The runner now rewrites
    # the report after every case, so a timeout still uploads what finished.
    needs: functional
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run text tier without skills
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p evals/reports
          uv run --project evals evals/runner.py --tier text --without-skill \
            --trials 1 --skip-permissions \
            --report evals/reports/obsolescence.json --summary summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsolescence-report
          path: evals/reports/obsolescence.json
          if-no-files-found: ignore

  docs-drift:
    # Canary, no LLM: hash the PROSE of the published minimal.dev pages the
    # skills link and compare against the committed snapshot. Content drift
    # means a skill may be restating (or contradicting) stale docs. Site
    # chrome is excluded deliberately: see evals/docs_hash.py.
    #
    # Drift is a warning plus a re-baseline pull request, not a failure. It
    # used to fail the job, and the re-baseline was a manual edit nobody
    # made: the lane sat red on 17 of the 25 nights to 2026-09-11 for pages
    # whose only fix was committing the JSON the job had already printed.
    # Now the job writes the fresh snapshot and opens (or updates) a PR on
    # chore/docs-snapshot-rebaseline carrying it, so a human reviews the
    # diff and merging clears the canary. The job fails only when a page
    # cannot be fetched or hashed, or when the PR cannot be raised: those
    # are the canary itself being broken. BLOCKING on those.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      pr-url: ${{ steps.pr.outputs.pull-request-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check linked docs pages for drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          snapshot=evals/docs-snapshots.json
          mapfile -t urls < <(grep -rhoE 'https://minimal\.dev/[A-Za-z0-9._/-]+' skills/*/SKILL.md 2>/dev/null | sed -E 's/[.,]+$//' | sort -u)
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::No https://minimal.dev/ URLs found in skills/*/SKILL.md" >&2
            exit 1
          fi
          # Hash the prose, not the response. Astro fingerprints every asset
          # per build, so hashing whole pages made an unrelated site deploy
          # look like all nine tracked pages drifting at once.
          current_json="$(python3 evals/docs_hash.py "${urls[@]}")"
          declare -A current
          while IFS=$'\t' read -r url hash; do
            current["$url"]="$hash"
          done < <(printf '%s' "$current_json" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')
          if [ ! -f "$snapshot" ]; then
            echo "::warning::$snapshot does not exist yet. Commit the JSON below as $snapshot to arm this canary."
            echo "$current_json"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=()
          for url in "${urls[@]}"; do
            old="$(jq -r --arg u "$url" '.[$u] // empty' "$snapshot")"
            if [ -z "$old" ]; then
              echo "NEW (not in snapshot): $url"
              changed+=("NEW: $url")
            elif [ "$old" != "${current[$url]}" ]; then
              echo "CHANGED: $url"
              changed+=("CHANGED: $url")
            fi
          done
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift across ${#urls[@]} linked docs pages."
            exit 0
          fi
          # The fresh baseline, in docs_hash.py's own format, for the PR step
          # to commit. Pages no longer linked drop out of the file with it.
          printf '%s\n' "$current_json" > "$snapshot"
          {
            echo "drift=true"
            echo "changed<<CHANGED_EOF"
            printf -- '- %s\n' "${changed[@]}"
            echo "CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Docs drift (${#changed[@]} of ${#urls[@]} linked pages)"
            echo
            printf -- '- %s\n' "${changed[@]}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Docs drift on ${#changed[@]} linked page(s): ${changed[*]}. Re-check the skills that cite them; a re-baseline PR follows."
      - name: Open or update the re-baseline pull request
        id: pr
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: chore/docs-snapshot-rebaseline
          delete-branch: true
          add-paths: evals/docs-snapshots.json
          commit-message: "chore(evals): re-baseline the docs drift canary"
          title: "chore(evals): re-baseline the docs drift canary"
          body: |
            The nightly docs-drift canary found these linked minimal.dev pages changed since the committed snapshot:

            ${{ steps.drift.outputs.changed }}

            Re-read each page against the skill that cites it and adjust the skill if the docs now say something different. `evals/docs-snapshots.json` here is the exact output of `evals/docs_hash.py` for the pages as of this run; merging accepts it as the new baseline and clears the canary.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Report the re-baseline pull request
        if: steps.drift.outputs.drift == 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OP: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          echo "::warning::Docs drift re-baseline PR ($PR_OP): $PR_URL"
          echo "Re-baseline PR ($PR_OP): $PR_URL" >> "$GITHUB_STEP_SUMMARY"

  notify:
    # Open or update a single tracking issue when a blocking nightly job
    # fails, and post the same to Slack. obsolescence is continue-on-error,
    # so it never lands here; docs drift alone does not either, its report
    # is the re-baseline PR.
    needs: [text, functional, obsolescence, docs-drift]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the nightly-evals tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEXT: ${{ needs.text.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
          OBSOLESCENCE: ${{ needs.obsolescence.result }}
          DOCS_DRIFT: ${{ needs.docs-drift.result }}
          DRIFT_PR: ${{ needs.docs-drift.outputs.pr-url }}
        run: |
          set -euo pipefail
          # Dedup by label, not title search: label filtering is immediately
          # consistent, so back-to-back failures cannot open duplicates.
          gh label create nightly --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Nightly eval failure" 2>/dev/null || true
          drift_note=""
          if [ -n "$DRIFT_PR" ]; then
            drift_note=" (re-baseline PR: $DRIFT_PR)"
          fi
          body="$(printf 'A nightly-evals run failed.\n\n- text: %s\n- functional: %s\n- obsolescence (advisory): %s\n- docs-drift: %s%s\n\nRun: %s' \
            "$TEXT" "$FUNCTIONAL" "$OBSOLESCENCE" "$DOCS_DRIFT" "$drift_note" "$RUN_URL")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label nightly --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            url="$REPO_URL/issues/$existing"
          else
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "nightly-evals failure" --body "$body" --label nightly)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        # Fails soft until the SLACK_WEBHOOK_URL secret is set on this repo.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*nightly-evals failed:* `${{ github.repository }}`\nJobs: text=${{ needs.text.result }}, functional=${{ needs.functional.result }}, obsolescence=${{ needs.obsolescence.result }}, docs-drift=${{ needs.docs-drift.result }}\nIssue: ${{ steps.issue.outputs.url || 'unknown' }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
